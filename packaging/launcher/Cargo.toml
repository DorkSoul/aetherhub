[package]
name = "aetherhub"
version = "1.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Starts the bundled Aetherhub server and shows a window that keeps it running"

[[bin]]
name = "aetherhub"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
opt-level = "s"
strip = true
lto = true

[workspace]
