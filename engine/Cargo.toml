[workspace]
resolver = "2"
members = ["crates/mtg-engine", "crates/mtg-cards", "crates/mtg-ai", "crates/mtg-node"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "10", features = ["serde-compat"] }
schemars = "0.8"
rkyv = "0.8"
rayon = "1"
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
rand_chacha = "0.3"
smallvec = { version = "1", features = ["serde"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3

# Quick local iteration build (engine edits): `cargo build --profile fast` -> target/fast.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
opt-level = 2
