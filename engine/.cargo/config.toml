# Limits parallel rustc jobs: the 12k-line resolve.rs / cast.rs units are memory-hungry.
[build]
jobs = 6

[env]
# ts-rs writes generated TypeScript here when `cargo test` runs (checked for staleness in CI)
TS_RS_EXPORT_DIR = { value = "../packages/shared/src/rules/generated", relative = true }
# debug-build tests recurse deeply (resolve/triggers frames are large): give test threads room
RUST_MIN_STACK = "67108864"
